services:
  groove:
    build: .
    container_name: groove
    # Host networking is required for UDP bulb discovery + control
    network_mode: host
    environment:
      - GROOVE_DATA_DIR=/data
      # - GOVEE_API_KEY=your-key-here   # optional: fetch bulb names automatically
    volumes:
      - ./data:/data
    restart: unless-stopped
